allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  esbuild: false
  sharp: false
  unrs-resolver: false

# pnpm 12 no longer reads the pnpm field in package.json, so overrides must go here.
overrides:
  # The dev dependency chain drizzle-kit → @esbuild-kit/esm-loader → @esbuild-kit/core-utils pins
  # esbuild ~0.18.20, and <= 0.24.2 has a known advisory (esbuild's dev server lets any site send
  # cross-origin requests and read the responses, GHSA-67mh-4wv8-2f99, reported as moderate by
  # pnpm audit). That chain has been merged into tsx and marked deprecated, so no upstream fix is
  # coming and we have to bump it ourselves. core-utils only uses esbuild's transform / build and
  # never touches the dev server, so the advisory isn't reachable anyway. This uses ^0.25.0 (the
  # first fixed release line, aligned with drizzle-kit's own esbuild ^0.25.4, resolving to a
  # version already in the repo with no new downloads).
  # Overriding outside the declared range needs evidence: after the change, pnpm db:generate /
  # db:migrate / notices:check were all verified to work.
  "@esbuild-kit/core-utils>esbuild": "^0.25.0"
  # @react-email/ui (the dev-only `pnpm email:dev` preview server) pins next to an exact version,
  # and 16.3.3 has a critical advisory (remote code execution in next/og ImageResponse, fixed in
  # >= 16.3.6). 6.11.0 is the latest release, so there is no upstream fix yet. Pin it to the same
  # next the app uses (16.3.6, already in the lockfile, no new downloads). Overriding outside the
  # declared range needs evidence: after the change, `pnpm email:dev` started and rendered the
  # templates. Drop this once @react-email/ui ships with next >= 16.3.6.
  "@react-email/ui>next": "16.3.6"
  toml: ">=4.2.0"
  uuid: ">=11.1.1"

# pnpm's supply-chain policy (minimumReleaseAge) rejects versions that are too new by default;
# resend 6.30.0 hadn't been out that long, so pnpm added it here automatically during install.
# Kept on purpose: if you delete it, the next install writes it back, and CI's --frozen-lockfile
# may fail the policy check.
minimumReleaseAgeExclude:
  - resend@6.30.0
