name: tls-expiry

# Checks the remaining validity of the site's TLS certificate once a day: if under 30 days, it
# opens an issue and fails the run. The alert itself depends on no external service, and the run
# turns green on its own once the certificate is renewed.
on:
  schedule:
    # 01:00 UTC daily.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      hosts:
        description: Hosts to check, comma-separated; leave empty to use the domain from site.config.ts
        required: false
      days:
        description: Alert when fewer than this many days remain
        required: false
        default: "30"
  pull_request:
    paths:
      - .github/workflows/tls-expiry.yml
      - scripts/check-tls-expiry.mjs

concurrency:
  group: tls-expiry
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # The script only uses Node built-in modules, so no dependency install is needed.
      - name: Check remaining certificate validity
        id: check
        env:
          SSL_CHECK_HOSTS: ${{ inputs.hosts }}
          SSL_CHECK_DAYS: ${{ inputs.days }}
          # When site.config.ts overrides the domain with SITE_DOMAIN (the demo site), set the same
          # value here.
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          set +e
          node scripts/check-tls-expiry.mjs | tee /tmp/tls-report.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # On PRs, only run the check; don't touch issues.
      - name: Open a reminder issue
        if: steps.check.outputs.status != '0' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="TLS certificate expires in less than 30 days"
          open=$(gh issue list --state open --limit 100 --search "$title in:title" --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "A reminder issue is already open; not creating another one."
            exit 0
          fi
          {
            echo "The daily check (\`.github/workflows/tls-expiry.yml\`) found a certificate that is about to expire:"
            echo
            echo '```'
            cat /tmp/tls-report.txt
            echo '```'
            echo
            echo "First confirm with your hosting provider whether the certificate has been renewed (certificates managed by Vercel renew automatically)."
            echo "Once renewed, this workflow turns green on its own and you can close this issue. If it keeps failing for several days, the renewal is stuck."
            echo
            echo "This run: $RUN_URL"
          } > /tmp/issue-body.md
          gh issue create --title "$title" --body-file /tmp/issue-body.md

      - name: Fail the run
        if: steps.check.outputs.status != '0'
        run: |
          echo "A certificate is close to expiry, or at least one host could not be reached." >&2
          exit 1
