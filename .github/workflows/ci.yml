name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Environment variables shared by every job. GitHub Actions doesn't support YAML anchors, so shared
# variables have to live at this level; otherwise, with multiple jobs, each job would need its own
# copy and changing one variable would mean editing five places.
# The `static` job also gets DATABASE_URL (pointing at a port with no postgres running), which is
# harmless: that leg only runs read-only file checks, and no step connects to the database.
env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
  DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/postgres
  # Production builds send email through Resend by default and require RESEND_API_KEY; CI writes
  # to files instead, and e2e reads them from .tmp/emails/.
  # e2e runs against a production build (next start, NODE_ENV=production), where the production
  # runtime only allows resend by default, so console / file are explicitly allowed here.
  EMAIL_TRANSPORT: file
  ALLOW_NON_RESEND_EMAIL: "1"
  # Fixed value for CI only; production sets its own on Vercel.
  BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-for-production
  # Site identity: it ships with placeholder values, which the placeholder sentinel blocks in
  # production builds (src/core/config/sentinels.ts). CI gets past it with obviously fake values;
  # production sets the real values on Vercel.
  SITE_NAME: CI Site
  SITE_DOMAIN: ci.example.test
  SITE_LEGAL_NAME: CI Legal Entity
  SITE_EMAIL_FROM: noreply@ci.example.test
  # e2e uses the on-site fake payment provider to simulate checkout and webhooks (env validation
  # rejects it on Vercel).
  BILLING_PROVIDER: fake
  # The paid plans in site.config.ts ship with placeholder product IDs, which checkout rejects with
  # plan_not_configured; CI uses non-placeholder fake IDs so the checkout flow can run. Production
  # sets the real IDs on Vercel.
  CREEM_PRODUCT_ID_PRO: prod_ci_fake_pro
  CREEM_PRODUCT_ID_LIFETIME: prod_ci_fake_lifetime
  # How long the success page waits for the webhook; shortened so the timeout message can be tested.
  BILLING_SUCCESS_TIMEOUT_MS: 8000
  # e2e admin accounts (one per Playwright project, including the acquisition / status / flags
  # suite projects).
  ADMIN_EMAILS: e2e-admin-desktop@example.com,e2e-admin-mobile@example.com,e2e-admin-acquisition-desktop@example.com,e2e-admin-acquisition-mobile@example.com,e2e-admin-status-desktop@example.com,e2e-admin-status-mobile@example.com,e2e-admin-flags-desktop@example.com,e2e-admin-flags-mobile@example.com
  # e2e runs against a production build (next start, NODE_ENV=production), so the fake provider
  # must be explicitly allowed.
  ALLOW_FAKE_BILLING: "1"
  # CI has no Upstash (and no VERCEL_ENV, so it looks like self-hosted production): by default the
  # rate-limit layer rejects AI / upload / checkout requests when Redis is missing, so this
  # explicitly switches it to "skip rate limiting", same as local development.
  ALLOW_UNRATELIMITED: "1"

# Why multiple jobs: this used to be one serial job taking about 10 minutes of wall-clock time, of
# which the four e2e suites took around 6 minutes combined, even though they are completely
# independent of each other — separate ports, separate temporary copies, separate postgres
# containers. Split up, wall-clock time is set by the longest leg, about 4.7 minutes.
# The repo is public and Actions minutes are free, so this only optimizes wall-clock time and
# makes no tradeoffs to save runner time.
jobs:
  # Static checks that only read files. They don't connect to a database, so no postgres service.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Dependency vulnerability gate: compares pnpm-lock.yaml against the registry's advisory
      # database and blocks anything >= high.
      # The level is high rather than moderate: moderates are common in dev toolchains, some of
      # them describe code paths this project never reaches (e.g. esbuild's dev server), and
      # forcing fixes tempts people to write out-of-range overrides just to silence them; high /
      # critical is the line that must be dealt with. The baseline was 0 when the gate was turned
      # on — the only moderate at the time (esbuild in the @esbuild-kit chain) was fixed with
      # overrides, see pnpm-workspace.yaml.
      # No --ignore-registry-errors: when the registry flakes, the gate should rather fail
      # closed; just rerun it.
      - run: pnpm audit --audit-level=high

      - run: pnpm lint

      - run: pnpm format:check

      # THIRD-PARTY-NOTICES.md is a legal compliance file shipped with the product, listing the
      # versions and licenses buyers actually get after pnpm install. Dependabot changes
      # dependencies weekly and the notices file doesn't follow on its own, so this step compares
      # it entry by entry against pnpm-lock.yaml and pnpm licenses list and fails on drift.
      - run: pnpm notices:check
      - run: pnpm english:check

      # Release package self-check: zero hits for credentials / seller domains / internal docs,
      # and all required files present. It used to run only when a package was built by hand
      # (which amounted to no safeguard at all); now it runs on every PR, at the cost of roughly
      # one unzip + grep.
      - run: scripts/release-package.sh

      - run: pnpm typecheck

      # Migration metadata self-check: idx is contiguous, when is strictly increasing, tags aren't
      # duplicated, and the snapshot chain is closed.
      # A migration whose `when` doesn't increase is silently skipped on a database that already
      # has a migration journal (this caused a production incident in 2026-09). This step catches
      # inconsistencies at the repo file level, at the cost of roughly one JSON parse.
      - run: pnpm migrations:check

  # Unit tests. They need an empty database to run migrations on, hence the postgres service.
  #
  # db:migrate now runs once in every leg that touches the database (here + the four e2e legs
  # below). It used to run once for the whole pipeline, with the four e2e suites sharing that one
  # database; after the split, each leg has its own postgres container and migrates it itself.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Run migrations on an empty database to verify the migration files work.
      - run: pnpm db:migrate

      # `--coverage` must follow `pnpm test` directly (`pnpm test --coverage`): written as
      # `pnpm test -- --coverage`, pnpm expands it to `vitest run -- --coverage`, and that `--`
      # turns the flag into an unrelated argument, so coverage is silently not collected and all
      # thresholds become meaningless (verified: the run ends without a coverage table).
      - run: pnpm test --coverage

  # e2e: four legs in parallel, one suite each.
  #
  # Without `name`, GitHub puts every matrix field into the check name
  # (`e2e (main, pnpm test:e2e, 1, playwright-report)`), which is noisy on PRs.
  # It only affects display; `needs` refers to the job id (`e2e`), which this line doesn't change.
  e2e:
    name: e2e (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Selling downloadable files (src/features/downloads/) is only turned on in the main suite,
    # covered by e2e/downloads.spec.ts; the other legs leave it empty (envOverride treats an empty
    # value as unset), keeping the default off.
    env:
      SITE_DOWNLOADS: ${{ matrix.downloads }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      # Don't cancel the other legs when one fails: diagnostics from the other suites are exactly
      # what you need when something fails.
      fail-fast: false
      matrix:
        # Only the main suite needs build=1. The other three suites' serve.ts copies the repo to a
        # temporary directory, patches site.config.ts, and runs `pnpm build` itself (see the two
        # `if (process.env.CI)` lines in e2e/<suite>/serve.ts); they never read the root .next —
        # running a root build for them would just waste about 45s and put an unused .next into
        # the copied directory.
        # Artifacts differ per leg: the main suite uses the html reporter (playwright-report/),
        # while the three sub-suites use `reporter: "list"` with no html report, and their failure
        # traces land in their own test-results/<suite>/.
        include:
          - suite: main
            script: pnpm test:e2e
            build: "1"
            artifact: playwright-report
            downloads: "1"
          - suite: acquisition
            script: pnpm test:e2e:acquisition
            build: ""
            artifact: test-results/acquisition
            downloads: ""
          - suite: flags
            script: pnpm test:e2e:flags
            build: ""
            artifact: test-results/flags
            downloads: ""
          - suite: invoices
            script: pnpm test:e2e:invoices
            build: ""
            artifact: test-results/invoices
            downloads: ""
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The main suite's webServer is `pnpm start`, which serves this build output.
      - if: matrix.build == '1'
        run: pnpm build

      - run: pnpm db:migrate

      - run: pnpm exec playwright install --with-deps chromium

      - run: ${{ matrix.script }}

      # Sub-suite traces used to never get uploaded (the old version only uploaded the root
      # playwright-report/, and those three suites produce no html report), leaving nothing to
      # inspect after a failure. This uploads each leg's own output directory.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-${{ matrix.suite }}
          path: ${{ matrix.artifact }}
          retention-days: 7

  # Aggregate gate. With multiple jobs, PRs need a single green/red signal instead of checking
  # six of them one by one.
  # The name must stay `ci`: the GitHub section of the README launch checklist tells buyers to
  # make it a required check on main. If it's renamed, PRs configured per the docs get stuck
  # forever waiting on a check that will never appear.
  #
  # `always()` makes it run no matter what and fail inside a step, rather than using `if:` and
  # letting the job be skipped: a skipped required check blocks the PR.
  ci:
    if: always()
    needs: [static, unit, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize upstream results
        run: |
          echo "static=${{ needs.static.result }}"
          echo "unit=${{ needs.unit.result }}"
          echo "e2e=${{ needs.e2e.result }}"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] ||
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "An upstream job failed or was cancelled." >&2
            exit 1
          fi
