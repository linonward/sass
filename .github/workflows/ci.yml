name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/postgres
      # 生产构建默认用 Resend 发信并要求 RESEND_API_KEY；CI 改为写文件，e2e 从 .tmp/emails/ 读取。
      EMAIL_TRANSPORT: file
      # 仅供 CI 使用的固定值；生产环境在 Vercel 上单独设置。
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-for-production
      # e2e 用站内的 fake 支付服务商模拟结账和 webhook（Vercel 上会被 env 校验拒绝）。
      BILLING_PROVIDER: fake
      # 成功页等待 webhook 的时长，调短以便测试超时提示。
      BILLING_SUCCESS_TIMEOUT_MS: 8000
      # e2e/admin.spec.ts 的管理员账号（每个 Playwright project 一个）。
      ADMIN_EMAILS: e2e-admin-desktop@example.com,e2e-admin-mobile@example.com
      # e2e 跑在生产构建上（next start，NODE_ENV=production），fake 服务商必须显式放行才可用。
      ALLOW_FAKE_BILLING: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      # 在空库上执行迁移，验证迁移文件可用。
      - run: pnpm db:migrate

      - run: pnpm test

      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
