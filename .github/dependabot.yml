# Checks for dependency updates weekly and opens PRs. The template is the upstream of buyers'
# projects, so dependency upgrades go through PRs where they can be reviewed.
# Configuration options: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # The repo uses pnpm (packageManager in package.json + pnpm-lock.yaml), but dependabot has no
  # pnpm ecosystem value; pnpm projects still use npm.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      # Produces `chore(deps): bump ...` / `chore(deps-dev): bump ...`, following Conventional
      # Commits.
      prefix: "chore"
      include: scope
    groups:
      # Each group below must move together: upgrading only one package breaks the version match.
      better-auth:
        # auth (the better-auth CLI) bundles an exact better-auth version (see
        # node_modules/auth/package.json). The project's better-auth must be the same version,
        # otherwise the schema generated by pnpm auth:generate won't match the runtime library.
        patterns:
          - "better-auth"
          - "@better-auth/*"
          - "auth"
      react:
        # react / react-dom are pinned to exact versions; @types/react / @types/react-dom follow
        # react's minor version.
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      next:
        # eslint-config-next must match the next version (both are pinned exactly in package.json).
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
      opentelemetry:
        # @opentelemetry/* and @vercel/otel are a set of exact versions in package.json; mixing
        # versions easily causes runtime problems.
        patterns:
          - "@opentelemetry/*"
          - "@vercel/otel"
      # All other minor / patch updates are combined into one PR to reduce noise. The groups above
      # are excluded with exclude-patterns rather than relying on dependabot's group matching
      # order. Majors don't go in this group; they get separate PRs to be evaluated one by one.
      minor-and-patch:
        update-types:
          - minor
          - patch
        patterns:
          - "*"
        exclude-patterns:
          - "better-auth"
          - "@better-auth/*"
          - "auth"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "next"
          - "eslint-config-next"
          - "@next/*"
          - "@opentelemetry/*"
          - "@vercel/otel"
    ignore:
      # The major version of @types/node must follow the **runtime** Node version, and the runtime
      # isn't in package.json's dependencies (engines / .nvmrc pin it to 24). Dependabot can't see
      # that coupling, so it follows DefinitelyTyped's cadence and proposes 26. After that upgrade,
      # TS accepts APIs that only exist in Node 26, and production on 24 only blows up at runtime.
      # Bump this by hand when upgrading the runtime (engines + .nvmrc + CI + Vercel together).
      # Other @types/* don't need ignoring: the runtimes of pg, ws, and react are dependencies
      # themselves, so both sides are proposed together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: scope
